name: Build and Developmental Release

on:
push:
branches:
- '**'
workflow_dispatch:

jobs:
build:
name: Build x64-Release
runs-on: windows-latest

```
steps:
  - name: Checkout Repository
    uses: actions/checkout@v4
    
  - name: Build Frontend
    shell: pwsh
    run: |
      cd frontend
      npm install
      npm run build

      # Ensure destination exists
      mkdir ..\backend\bin\resources -Force
      mkdir ..\backend\bin\resources\adaf.starforge -Force

      # Copy frontend output safely
      Copy-Item "out\*" "..\backend\bin\resources\adaf.starforge" -Recurse -Force

  - name: Build Geode Mod
    uses: geode-sdk/build-geode-mod@main
    id: build
    with:
      path: backend 

  - name: Compress Build Output
    shell: pwsh
    run: |
      cd backend

      if (Test-Path out) { Remove-Item -Recurse -Force out }
      mkdir out

      # Copy resources if they exist
      if (Test-Path bin\resources) { Copy-Item bin\resources out\resources -Recurse -Force }
      if (Test-Path resources) { Copy-Item resources out\resources -Recurse -Force }

      # Copy metadata files if they exist
      if (Test-Path about.md) { Copy-Item about.md out/ }
      if (Test-Path changelog.md) { Copy-Item changelog.md out/ }
      if (Test-Path logo.png) { Copy-Item logo.png out/ }
      if (Test-Path mod.json) { Copy-Item mod.json out/ }

      # Copy built DLLs
      if (Test-Path build) { Copy-Item build\*.dll out/ -Force }

      # Cleanup unwanted files
      Get-ChildItem -Recurse -Include *.psd, *.blend -Path out | Remove-Item -Force -ErrorAction SilentlyContinue

      cd out
      7z a -tzip adaf.starforge.geode -mx9 *

  - name: Upload Build Artifact
    uses: actions/upload-artifact@v4
    with:
      name: adaf.starforge.geode
      path: backend/out/adaf.starforge.geode
```

release:
name: Create Developmental Release
needs: build
runs-on: ubuntu-latest
permissions:
contents: write

```
steps:
  - name: Download Build Artifact
    uses: actions/download-artifact@v4
    with:
      name: adaf.starforge.geode
      path: .

  - name: Update Development Release
    uses: andelf/nightly-release@main
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      tag_name: develop
      name: 'Developmental Build'
      body: |
        Development release for commit ${{ github.sha }}.
      files: |
        ./adaf.starforge.geode
```
